plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.minimal.launcher'
    compileSdk 36

    defaultConfig {
        applicationId "com.minimal.launcher"
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName "1.2"
    }

    // lite: no accessibility service / notification listener, so sideloaded installs aren't
    //       blocked by Google Play Protect. No double-tap lock or now playing bar.
    // full: everything, but Play Protect may block or warn when sideloading.
    flavorDimensions 'features'
    productFlavors {
        lite {
            dimension 'features'
        }
        full {
            dimension 'features'
            versionNameSuffix '-full'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.11.0'
}
