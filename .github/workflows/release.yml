# Publishes a GitHub release when a commit on main starts with a version, e.g. "v1.3: Title".
# Every other commit only runs the first two steps and stops. See .github/RELEASING.md.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  # The certificate F-Droid accepts for this app (AllowedAPKSigningKeys in its recipe)
  EXPECTED_CERT_SHA256: 7a0811bbdde638db9419629c1310966781ad509b7c5dac79c9f517ab04d36a90

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Look for a release commit
        id: find
        # Explicit so a failure in the script fails the step, despite the pipe into tee
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # Kept outside the checkout: the release commit may be older than these files
          cp .github/release/signing.init.gradle "$RUNNER_TEMP/"
          bash .github/release/find-release.sh "$BEFORE" "$AFTER" "$RUNNER_TEMP/notes.md" | tee -a "$GITHUB_OUTPUT"

      - name: Check the release
        id: check
        if: steps.find.outputs.tag != ''
        env:
          VERSION: ${{ steps.find.outputs.version }}
          TAG: ${{ steps.find.outputs.tag }}
          SHA: ${{ steps.find.outputs.sha }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::notice::$TAG already exists, nothing to release"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git checkout -q "$SHA"

          name=$(sed -nE 's/.*versionName "([^"]+)".*/\1/p' app/build.gradle)
          code=$(sed -nE 's/.*versionCode ([0-9]+).*/\1/p' app/build.gradle)
          if [ "$name" != "$VERSION" ]; then
            echo "::error::The commit says $TAG but app/build.gradle has versionName $name. Update it and commit again."
            exit 1
          fi

          previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          if [ -n "$previous" ]; then
            previous_code=$(git show "$previous:app/build.gradle" | sed -nE 's/.*versionCode ([0-9]+).*/\1/p')
            if [ "$code" -le "$previous_code" ]; then
              echo "::error::versionCode $code must be higher than $previous_code, used by $previous."
              exit 1
            fi
          fi

          if [ ! -f "fastlane/metadata/android/en-US/changelogs/$code.txt" ]; then
            echo "::warning::No fastlane/metadata/android/en-US/changelogs/$code.txt, so F-Droid won't show a changelog for this version."
          fi

      - uses: actions/setup-java@v4
        if: steps.find.outputs.tag != '' && steps.check.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: '21'

      - name: Build the signed APK
        if: steps.find.outputs.tag != '' && steps.check.outputs.skip != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for secret in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!secret}" ]; then
              echo "::error::The repository secret $secret is missing. See .github/RELEASING.md."
              exit 1
            fi
          done
          export KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          trap 'rm -f "$KEYSTORE_FILE"' EXIT
          # bash: gradlew isn't marked executable in the repository
          bash ./gradlew assembleRelease --no-daemon --console=plain -I "$RUNNER_TEMP/signing.init.gradle"

      - name: Check the signature
        if: steps.find.outputs.tag != '' && steps.check.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.find.outputs.version }}
        run: |
          apk="$RUNNER_TEMP/MinimalSF_v$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          cert=$("$apksigner" verify --print-certs "$apk" | sed -nE 's/.*certificate SHA-256 digest: ([0-9a-f]+).*/\1/p')
          if [ "$cert" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::The APK is signed with $cert, but F-Droid expects $EXPECTED_CERT_SHA256."
            exit 1
          fi

      # Last on purpose: F-Droid looks for new tags and then downloads this APK, so the tag
      # must only appear once the APK is built and checked, and both must appear together.
      - name: Publish the release
        if: steps.find.outputs.tag != '' && steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.find.outputs.version }}
          TAG: ${{ steps.find.outputs.tag }}
          TITLE: ${{ steps.find.outputs.title }}
          SHA: ${{ steps.find.outputs.sha }}
        run: |
          gh release create "$TAG" "$RUNNER_TEMP/MinimalSF_v$VERSION.apk" \
            --target "$SHA" --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.md"
